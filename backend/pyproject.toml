[project]
name = "wordinary-backend"
version = "0.1.0"
description = "FastAPI backend for Wordinary"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "asyncpg>=0.29",
  "boto3>=1.34",
  "fastapi>=0.115",
  "langchain>=1.0",
  "langchain-openai>=1.0",
  "pwdlib[argon2]>=0.2",
  "python-multipart>=0.0.9",
  "pyjwt>=2.8",
  "pytest>=8.0",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.30",
  "yt-dlp[default]>=2025.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
