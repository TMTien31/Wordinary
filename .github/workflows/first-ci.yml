name: My First Action

run-name: Build Wordinary native image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet

          echo "Compose services:"
          docker compose config --services

      - name: Build Docker image
        run: |
          docker compose build

      - name: Tag image with commit
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          docker tag \
            wordinary-api:latest \
            "wordinary-api:${SHORT_SHA}"

          echo "IMAGE_TAG=${SHORT_SHA}" >> "${GITHUB_ENV}"

      - name: Verify built image
        run: |
          echo "Image architecture:"

          docker image inspect \
            "wordinary-api:${IMAGE_TAG}" \
            --format='OS={{.Os}} Architecture={{.Architecture}}'

          echo "Wordinary images:"
          docker image ls wordinary-api