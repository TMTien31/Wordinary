name: Build and publish Wordinary API

run-name: Build Wordinary API from ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/tmtien31/wordinary-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet

          echo "Compose services:"
          docker compose config --services

      - name: Build ARM64 Docker image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --tag wordinary-api:latest \
            ./backend

      - name: Check built image architecture
        run: |
          docker image inspect wordinary-api:latest \
            --format 'Platform: {{.Os}}/{{.Architecture}}'

      - name: Tag Docker image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          docker tag \
            wordinary-api:latest \
            "${IMAGE_NAME}:${SHORT_SHA}"

          docker tag \
            wordinary-api:latest \
            "${IMAGE_NAME}:latest"

          echo "IMAGE_TAG=${SHORT_SHA}" >> "${GITHUB_ENV}"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Push Docker image
        run: |
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${IMAGE_NAME}:latest"

      - name: Show published images
        run: |
          echo "Published images:"
          echo "${IMAGE_NAME}:${IMAGE_TAG}"
          echo "${IMAGE_NAME}:latest"