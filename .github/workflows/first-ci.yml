name: My First Action

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect source code
        run: |
          echo "Current directory:"
          pwd

          echo "Latest commit:"
          git log -1 --oneline

          echo "Repository files:"
          find . \
            -maxdepth 2 \
            -type f \
            -not -path "./.git/*" \
            | sort \
            | head -100