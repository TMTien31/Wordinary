name: My First Action

run-name: Inspect build environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-build-environment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker tooling
        run: |
          echo "Docker:"
          docker --version

          echo "Docker Compose:"
          docker compose version

          echo "Docker Buildx:"
          docker buildx version

          echo "Runner architecture:"
          uname -m

      - name: Detect application manifests
        run: |
          echo "Build-related files:"

          find . \
            -maxdepth 4 \
            -type f \
            \( \
              -iname "Dockerfile*" \
              -o -iname "compose*.yml" \
              -o -iname "compose*.yaml" \
              -o -name "docker-compose.yml" \
              -o -name "docker-compose.yaml" \
              -o -name "package.json" \
              -o -name "requirements.txt" \
              -o -name "pyproject.toml" \
              -o -name "pom.xml" \
              -o -name "build.gradle" \
            \) \
            -not -path "./.git/*" \
            | sort