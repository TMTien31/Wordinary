name: Build and publish Wordinary images

run-name: Build Wordinary images from ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/tmtien31/wordinary-api
  FRONTEND_IMAGE: ghcr.io/tmtien31/wordinary-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet

          echo "Compose services:"
          docker compose config --services

      - name: Validate production Compose configuration
        run: |
          APP_ENV_FILE=env.prod.example \
            docker compose --env-file env.prod.example -f compose.prod.yaml config --quiet

      - name: Build ARM64 backend image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --tag wordinary-api:latest \
            ./backend

      - name: Build ARM64 frontend image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --tag wordinary-frontend:latest \
            ./frontend

      - name: Check built image architectures
        run: |
          echo "Backend image:"
          docker image inspect wordinary-api:latest \
            --format 'Platform: {{.Os}}/{{.Architecture}}'
          echo "Frontend image:"
          docker image inspect wordinary-frontend:latest \
            --format 'Platform: {{.Os}}/{{.Architecture}}'

      - name: Tag Docker images
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          docker tag \
            wordinary-api:latest \
            "${API_IMAGE}:${SHORT_SHA}"

          docker tag \
            wordinary-api:latest \
            "${API_IMAGE}:latest"

          docker tag \
            wordinary-frontend:latest \
            "${FRONTEND_IMAGE}:${SHORT_SHA}"

          docker tag \
            wordinary-frontend:latest \
            "${FRONTEND_IMAGE}:latest"

          echo "IMAGE_TAG=${SHORT_SHA}" >> "${GITHUB_ENV}"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Push Docker images
        run: |
          docker push "${API_IMAGE}:${IMAGE_TAG}"
          docker push "${API_IMAGE}:latest"
          docker push "${FRONTEND_IMAGE}:${IMAGE_TAG}"
          docker push "${FRONTEND_IMAGE}:latest"

      - name: Show published images
        run: |
          echo "Published images:"
          echo "${API_IMAGE}:${IMAGE_TAG}"
          echo "${API_IMAGE}:latest"
          echo "${FRONTEND_IMAGE}:${IMAGE_TAG}"
          echo "${FRONTEND_IMAGE}:latest"
