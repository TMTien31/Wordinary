name: Build and deploy Wordinary

run-name: Deploy Wordinary from ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wordinary-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/tmtien31/wordinary-api
  FRONTEND_IMAGE: ghcr.io/tmtien31/wordinary-frontend

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./backend

      - name: Run backend tests
        run: |
          python -m pytest backend/tests

      - name: Run repository smoke checks
        run: |
          python scripts/verify_source_encoding.py
          python scripts/verify_structure.py
          python scripts/verify_frontend_contracts.py
          python scripts/verify_i18n.py

  build-and-push:
    runs-on: ubuntu-latest
    needs: quality-gate
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet

          echo "Compose services:"
          docker compose config --services

      - name: Validate production Compose configuration
        run: |
          APP_ENV_FILE=env.prod.example \
            docker compose --env-file env.prod.example -f compose.prod.yaml config --quiet

      - name: Build ARM64 backend image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --tag wordinary-api:latest \
            ./backend

      - name: Build ARM64 frontend image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --tag wordinary-frontend:latest \
            ./frontend

      - name: Check built image architectures
        run: |
          echo "Backend image:"
          docker image inspect wordinary-api:latest \
            --format 'Platform: {{.Os}}/{{.Architecture}}'
          echo "Frontend image:"
          docker image inspect wordinary-frontend:latest \
            --format 'Platform: {{.Os}}/{{.Architecture}}'

      - name: Verify backend runtime dependencies
        run: |
          docker run --rm wordinary-api:latest sh -lc '
            which deno
            deno --version
            python -m yt_dlp --version
          '

      - name: Tag Docker images
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          docker tag \
            wordinary-api:latest \
            "${API_IMAGE}:${SHORT_SHA}"

          docker tag \
            wordinary-api:latest \
            "${API_IMAGE}:latest"

          docker tag \
            wordinary-frontend:latest \
            "${FRONTEND_IMAGE}:${SHORT_SHA}"

          docker tag \
            wordinary-frontend:latest \
            "${FRONTEND_IMAGE}:latest"

          echo "IMAGE_TAG=${SHORT_SHA}" >> "${GITHUB_ENV}"
          echo "image_tag=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Push Docker images
        run: |
          docker push "${API_IMAGE}:${IMAGE_TAG}"
          docker push "${API_IMAGE}:latest"
          docker push "${FRONTEND_IMAGE}:${IMAGE_TAG}"
          docker push "${FRONTEND_IMAGE}:latest"

      - name: Show published images
        run: |
          echo "Published images:"
          echo "${API_IMAGE}:${IMAGE_TAG}"
          echo "${API_IMAGE}:latest"
          echo "${FRONTEND_IMAGE}:${IMAGE_TAG}"
          echo "${FRONTEND_IMAGE}:latest"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
      DEPLOY_COMMIT: ${{ github.sha }}
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      ORACLE_DEPLOY_PATH: ${{ secrets.ORACLE_DEPLOY_PATH }}

    steps:
      - name: Prepare SSH
        run: |
          test -n "${ORACLE_HOST}" || (echo "Missing secret: ORACLE_HOST" >&2; exit 1)
          test -n "${ORACLE_USER}" || (echo "Missing secret: ORACLE_USER" >&2; exit 1)
          test -n "${ORACLE_SSH_KEY}" || (echo "Missing secret: ORACLE_SSH_KEY" >&2; exit 1)

          SSH_PORT="${ORACLE_PORT:-22}"

          mkdir -p ~/.ssh
          echo "${ORACLE_SSH_KEY}" > ~/.ssh/wordinary_oracle_key
          chmod 600 ~/.ssh/wordinary_oracle_key
          ssh-keyscan -p "${SSH_PORT}" -H "${ORACLE_HOST}" >> ~/.ssh/known_hosts

          echo "SSH_PORT=${SSH_PORT}" >> "${GITHUB_ENV}"

      - name: Deploy on Oracle
        run: |
          ssh -i ~/.ssh/wordinary_oracle_key -p "${SSH_PORT}" "${ORACLE_USER}@${ORACLE_HOST}" \
            "IMAGE_TAG='${IMAGE_TAG}' DEPLOY_COMMIT='${DEPLOY_COMMIT}' ORACLE_DEPLOY_PATH='${ORACLE_DEPLOY_PATH}' bash -s" <<'REMOTE'
          set -euo pipefail

          DEPLOY_PATH="${ORACLE_DEPLOY_PATH:-Wordinary}"
          case "${DEPLOY_PATH}" in
            /*) APP_DIR="${DEPLOY_PATH}" ;;
            *) APP_DIR="${HOME}/${DEPLOY_PATH}" ;;
          esac

          cd "${APP_DIR}"

          test -f .env || (echo "Missing ${APP_DIR}/.env" >&2; exit 1)
          test -f compose.prod.yaml || (echo "Missing ${APP_DIR}/compose.prod.yaml" >&2; exit 1)

          git fetch --prune origin main
          git checkout --detach "${DEPLOY_COMMIT}"
          test "$(git rev-parse HEAD)" = "${DEPLOY_COMMIT}"

          IMAGE_TAG="${IMAGE_TAG}" docker compose --env-file .env -f compose.prod.yaml pull
          IMAGE_TAG="${IMAGE_TAG}" docker compose --env-file .env -f compose.prod.yaml run --rm --no-deps api \
            python -c 'from app.core.config import settings; print(f"Production config OK: {settings.environment}")'
          IMAGE_TAG="${IMAGE_TAG}" docker compose --env-file .env -f compose.prod.yaml up -d --remove-orphans --force-recreate --wait --wait-timeout 120

          IMAGE_TAG="${IMAGE_TAG}" docker compose --env-file .env -f compose.prod.yaml ps

          IMAGE_TAG="${IMAGE_TAG}" docker compose --env-file .env -f compose.prod.yaml exec -T api sh -lc '
            which deno
            deno --version
            python -m yt_dlp --version
            test -n "${WORDINARY_COOKIES_FILE}"
            test -s "${WORDINARY_COOKIES_FILE}"
          '

          API_CONTAINER="$(IMAGE_TAG="${IMAGE_TAG}" docker compose --env-file .env -f compose.prod.yaml ps -q api)"
          FRONTEND_CONTAINER="$(IMAGE_TAG="${IMAGE_TAG}" docker compose --env-file .env -f compose.prod.yaml ps -q frontend)"
          API_IMAGE="$(docker inspect "${API_CONTAINER}" --format '{{.Config.Image}}')"
          FRONTEND_IMAGE="$(docker inspect "${FRONTEND_CONTAINER}" --format '{{.Config.Image}}')"
          test "${API_IMAGE}" = "ghcr.io/tmtien31/wordinary-api:${IMAGE_TAG}" || (echo "API is running ${API_IMAGE}, expected tag ${IMAGE_TAG}" >&2; exit 1)
          test "${FRONTEND_IMAGE}" = "ghcr.io/tmtien31/wordinary-frontend:${IMAGE_TAG}" || (echo "Frontend is running ${FRONTEND_IMAGE}, expected tag ${IMAGE_TAG}" >&2; exit 1)

          curl --fail --silent --show-error http://127.0.0.1:5500/ >/dev/null
          REMOTE
